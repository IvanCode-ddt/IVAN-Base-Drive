<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kho Google Drive — IVAN</title><link rel="stylesheet" href="/css/style.css?v=15"><link rel="stylesheet" href="/admin/admin.css?v=15"></head><body><main class="shell admin-main"><a class="back-link" href="/admin/">← Quay lại viết bài</a><h1>Kho Google Drive</h1><p id="message" role="status"></p><button id="drive-toggle" class="secondary-button" aria-expanded="false">Mở kho Drive</button><section id="drive-panel" class="drive-panel" hidden aria-labelledby="drive-title"><h2 id="drive-title">Kho Google Drive</h2><p>Chỉ đọc metadata trong thư mục gốc. Không tải nội dung file hoặc thay đổi quyền chia sẻ.</p><div class="drive-actions"><a class="primary-button" href="/auth/google">Kết nối lại Google</a><button type="button" id="drive-sync" class="secondary-button">Đồng bộ ngay</button><button type="button" id="drive-disconnect" class="secondary-button">Ngắt kết nối Drive</button></div><p id="drive-state"></p><p id="drive-message" role="status" aria-live="polite"></p><nav id="drive-breadcrumb" class="drive-breadcrumb" aria-label="Đường dẫn thư mục Drive"></nav><label class="drive-target-label">Gắn file vào bài viết<select id="drive-target"><option value="">Chọn bài viết…</option></select></label><label class="drive-target-label">Tìm trong các file đã đồng bộ<input id="drive-search" type="search" placeholder="Nhập tên file…"><small>Chỉ tìm trong các thư mục/trang đã mở ở phiên này.</small></label><div id="drive-files"></div><div class="drive-actions"><button type="button" id="drive-prev" class="secondary-button" disabled>← Trang trước</button><button type="button" id="drive-next" class="secondary-button" disabled>Trang sau →</button></div></section><section class="linked-panel"><h2>File của bài viết được chọn</h2><div id="linked-drive-files"></div></section></main><script type="module" src="/admin/library.js?v=10"></script></body></html>
